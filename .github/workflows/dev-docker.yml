name: Build & Push (dev)

on:
  push:
    branches: ['dev']

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ vars.DEV_IMAGE_NAME || 'ghapfy-gateway-dev' }}
  DOCKER_CONTEXT: ${{ vars.DOCKER_CONTEXT || '.' }}
  DOCKERFILE: ${{ vars.DOCKERFILE || 'Dockerfile' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate tags (Date.now and image name)
        shell: bash
        run: |
          echo "DATE_NOW=$(node -p 'Date.now()')" >> $GITHUB_ENV
          echo "DOCKER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}" >> $GITHUB_ENV
          echo "Computed tags for DEV:"
          echo "  $DOCKER_IMAGE:dev-$DATE_NOW"
          echo "  $DOCKER_IMAGE:latest"

      - name: Build & Push (dev + latest)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.DOCKER_CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.DOCKER_IMAGE }}:dev-${{ env.DATE_NOW }}
            ${{ env.DOCKER_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
